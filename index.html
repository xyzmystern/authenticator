<body>

<div class="container">

  <h1>🔐 My Authenticator</h1>
  <p class="subtitle">Private encrypted TOTP authenticator</p>

  <!-- LOCK SCREEN -->
  <div id="lockScreen" class="card">
    <h2 id="lockTitle">Create your vault</h2>

    <p class="small">
      Your authenticator data is encrypted in your browser.
      The password is never stored.
    </p>

    <input
      id="vaultPassword"
      type="password"
      placeholder="Vault password"

    </button>

      <button class="primary" onclick="showAddAccount()">

        📥 Import Backup

        id="backupFile"
        type="file"
        accept=".auth,.json"

<script>

/* =========================================================
   AUTHENTICATOR
   ========================================================= */

let vault = null;
let vaultPassword = null;
let vaultSalt = null;


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function bytesToBase64(bytes) {
  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}


function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes;
}


function randomBytes(length) {
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);
  return bytes;
}


/* =========================================================
   PASSWORD → ENCRYPTION KEY
   ========================================================= */

async function deriveKey(password, salt) {

  const encoder = new TextEncoder();

  const passwordKey = await crypto.subtle.importKey(
    "raw",
    encoder.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: salt,
      iterations: 310000,
      hash: "SHA-256"
    },
    passwordKey,
    {
      name: "AES-GCM",
      length: 256
    },
    false,
    ["encrypt", "decrypt"]
  );
}


/* =========================================================
   ENCRYPT VAULT
   ========================================================= */

async function encryptVault(data, password, salt) {

  const key = await deriveKey(password, salt);

  const iv = randomBytes(12);

  const encoded = new TextEncoder().encode(
    JSON.stringify(data)
  );

  const encrypted = await crypto.subtle.encrypt(
    {
      name: "AES-GCM",
      iv: iv
    },
    key,
    encoded
  );

  return {
    salt: bytesToBase64(salt),
    iv: bytesToBase64(iv),
    data: bytesToBase64(new Uint8Array(encrypted))
  };
}


/* =========================================================
   DECRYPT VAULT
   ========================================================= */

async function decryptVault(encryptedVault, password) {

  const salt = base64ToBytes(encryptedVault.salt);
  const iv = base64ToBytes(encryptedVault.iv);
  const encrypted = base64ToBytes(encryptedVault.data);

  const key = await deriveKey(password, salt);

  const decrypted = await crypto.subtle.decrypt(
    {
      name: "AES-GCM",
      iv: iv
    },
    key,
    encrypted
  );

  const text = new TextDecoder().decode(decrypted);

  return JSON.parse(text);
}


/* =========================================================
   SAVE
   ========================================================= */

async function saveVault() {

  if (!vault || !vaultPassword || !vaultSalt) {
    return;
  }

  const encrypted = await encryptVault(
    vault,
    vaultPassword,
    vaultSalt
  );

  localStorage.setItem(
    "encryptedAuthenticatorVault",
    JSON.stringify(encrypted)
  );
}


/* =========================================================
   UNLOCK / CREATE
   ========================================================= */

async function unlockVault() {

  const password =
    document.getElementById("vaultPassword").value;

  const message =
    document.getElementById("lockMessage");

  if (password.length < 10) {

    message.textContent =
      "Password must be at least 10 characters.";

    return;
  }


  const stored =
    localStorage.getItem(
      "encryptedAuthenticatorVault"
    );


  try {

    if (stored) {

      const encrypted =
        JSON.parse(stored);

      vault =
        await decryptVault(
          encrypted,
          password
        );

      vaultSalt =
        base64ToBytes(encrypted.salt);

    } else {

      vault = {
        accounts: []
      };

      vaultSalt =
        randomBytes(16);

      await saveVault();
    }


    vaultPassword = password;

    document.getElementById(
      "lockScreen"
    ).classList.add("hidden");

    document.getElementById(
      "app"
    ).classList.remove("hidden");

    document.getElementById(
      "vaultPassword"
    ).value = "";

    renderAccounts();

  } catch (error) {

    message.textContent =
      "Incorrect password or damaged vault.";

    console.error(error);
  }
}


/* =========================================================
   LOCK
   ========================================================= */

function lockVault() {

  vault = null;
  vaultPassword = null;
  vaultSalt = null;

  document.getElementById(
    "app"
  ).classList.add("hidden");

  document.getElementById(
    "lockScreen"
  ).classList.remove("hidden");

  document.getElementById(
    "lockTitle"
  ).textContent = "Unlock your vault";

  document.getElementById(
    "lockMessage"
  ).textContent = "";
}


/* =========================================================
   ADD ACCOUNT UI
   ========================================================= */

function showAddAccount() {

  document.getElementById(
    "addAccountCard"
  ).classList.remove("hidden");

}


function hideAddAccount() {

  document.getElementById(
    "addAccountCard"
  ).classList.add("hidden");

  document.getElementById(
    "issuer"
  ).value = "";

  document.getElementById(
    "accountName"
  ).value = "";

  document.getElementById(
    "secret"
  ).value = "";

  document.getElementById(
    "accountImage"
  ).value = "";

  document.getElementById(
    "imagePreview"
  ).style.display = "none";

  document.getElementById(
    "addMessage"
  ).textContent = "";
}


/* =========================================================
   IMAGE PREVIEW
   ========================================================= */

function previewImage(event) {

  const file = event.target.files[0];

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    alert("Please select an image.");

    event.target.value = "";

    return;
  }


  /*
    Limit image size before converting it.

    This keeps the encrypted vault from becoming
    unnecessarily large.
  */

  if (file.size > 2 * 1024 * 1024) {

    alert("Please choose an image smaller than 2 MB.");

    event.target.value = "";

    return;
  }


  const reader = new FileReader();

  reader.onload = function() {

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src = reader.result;

    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}


/* =========================================================
   ADD ACCOUNT
   ========================================================= */

async function addAccount() {

  const issuer =
    document.getElementById("issuer")
    .value.trim();

  const accountName =
    document.getElementById("accountName")
    .value.trim();

  const secret =
    document.getElementById("secret")
    .value
    .replace(/\s+/g, "")
    .toUpperCase();

  const imageFile =
    document.getElementById("accountImage")
    .files[0];


  const message =
    document.getElementById("addMessage");


  if (!accountName) {

    message.textContent =
      "Enter an account name.";

    return;
  }


  if (!secret) {

    message.textContent =
      "Enter a TOTP secret.";

    return;
  }


  if (!/^[A-Z2-7]+=*$/.test(secret)) {

    message.textContent =
      "That doesn't look like a valid Base32 secret.";

    return;
  }


  let image = "";


  if (imageFile) {

    if (!imageFile.type.startsWith("image/")) {

      message.textContent =
        "Please choose an image.";

      return;
    }


    if (imageFile.size > 2 * 1024 * 1024) {

      message.textContent =
        "Image must be smaller than 2 MB.";

      return;
    }


    image =
      await fileToDataURL(imageFile);
  }


  vault.accounts.push({

    id:
      crypto.randomUUID(),

    issuer:
      issuer || "Authenticator",

    accountName:
      accountName,

    secret:
      secret,

    image:
      image

  });


  await saveVault();

  hideAddAccount();

  renderAccounts();
}


/* =========================================================
   FILE → DATA URL
   ========================================================= */

function fileToDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });
}


/* =========================================================
   DELETE ACCOUNT
   ========================================================= */

async function deleteAccount(id) {

  if (!confirm("Delete this account?")) {
    return;
  }


  vault.accounts =
    vault.accounts.filter(
      account => account.id !== id
    );


  await saveVault();

  renderAccounts();
}


/* =========================================================
   DEFAULT ACCOUNT ICON
   ========================================================= */

function getDefaultIcon(issuer) {

  const name =
    issuer.toLowerCase();

  if (name.includes("discord"))
    return "💬";

  if (name.includes("google"))
    return "G";

  if (name.includes("github"))
    return "🐙";

  if (name.includes("microsoft"))
    return "▦";

  if (name.includes("apple"))
    return "";

  if (name.includes("amazon"))
    return "📦";

  if (name.includes("meta"))
    return "Ⓜ";

  return "🔐";
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   RENDER ACCOUNTS
   ========================================================= */

function renderAccounts() {

  const container =
    document.getElementById("accounts");

  container.innerHTML = "";


  if (!vault || vault.accounts.length === 0) {

    container.innerHTML = `
      <div class="card">
        <p>No accounts yet.</p>
        <p class="small">
          Add an account to start using your authenticator.
        </p>
      </div>
    `;

    return;
  }


  vault.accounts.forEach(account => {

    const card =
      document.createElement("div");

    card.className = "card";


    const imageHTML =
      account.image

      ? `<img
          class="account-image"
          src="${escapeHTML(account.image)}"
          alt=""
        >`

      : `<div
          class="account-image"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:26px;
          "
        >
          ${escapeHTML(
            getDefaultIcon(account.issuer)
          )}
        </div>`;


    card.innerHTML = `

      <div class="account">

        ${imageHTML}

        <div class="account-info">

          <div class="account-name">
            ${escapeHTML(account.accountName)}
          </div>

          <div class="issuer">
            ${escapeHTML(account.issuer)}
          </div>

          <div
            class="code"
            id="code-${account.id}"
          >
            ------ 
          </div>

          <div
            class="timer"
            id="timer-${account.id}"
          >
            Loading...
          </div>

        </div>

      </div>


      <div class="progress">
        <div
          class="progress-bar"
          id="progress-${account.id}"
        ></div>
      </div>


      <div class="actions">

        <button
          class="primary"
          onclick="copyCode('${account.id}')"
        >
          Copy Code
        </button>

        <button
          class="danger"
          onclick="deleteAccount('${account.id}')"
        >
          Delete
        </button>

      </div>

    `;


    container.appendChild(card);

    updateAccountCode(account);

  });

}


/* =========================================================
   BASE32 DECODER
   ========================================================= */

function base32ToBytes(base32) {

  const alphabet =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

  let bits = "";
  let output = [];

  base32 =
    base32
      .replace(/=+$/, "")
      .replace(/\s/g, "")
      .toUpperCase();


  for (const char of base32) {

    const value =
      alphabet.indexOf(char);

    if (value === -1) {
      throw new Error("Invalid Base32");
    }

    bits +=
      value
        .toString(2)
        .padStart(5, "0");
  }


  for (
    let i = 0;
    i + 8 <= bits.length;
    i += 8
  ) {

    output.push(
      parseInt(
        bits.slice(i, i + 8),
        2
      )
    );

  }


  return new Uint8Array(output);
}


/* =========================================================
   TOTP
   ========================================================= */

async function generateTOTP(secret) {

  const keyBytes =
    base32ToBytes(secret);


  const counter =
    Math.floor(
      Date.now() / 1000 / 30
    );


  const counterBytes =
    new ArrayBuffer(8);

  const view =
    new DataView(counterBytes);


  const high =
    Math.floor(
      counter / 0x100000000
    );

  const low =
    counter >>> 0;


  view.setUint32(0, high);
  view.setUint32(4, low);


  const key =
    await crypto.subtle.importKey(
      "raw",
      keyBytes,
      {
        name: "HMAC",
        hash: "SHA-1"
      },
      false,
      ["sign"]
    );


  const signature =
    new Uint8Array(
      await crypto.subtle.sign(
        "HMAC",
        key,
        counterBytes
      )
    );


  const offset =
    signature[
      signature.length - 1
    ] & 15;


  const binary =
    (
      ((signature[offset] & 127) << 24) |
      ((signature[offset + 1] & 255) << 16) |
      ((signature[offset + 2] & 255) << 8) |
      (signature[offset + 3] & 255)
    ) >>> 0;


  const code =
    binary % 1000000;


  return String(code)
    .padStart(6, "0");
}


/* =========================================================
   UPDATE ACCOUNT CODE
   ========================================================= */

async function updateAccountCode(account) {

  try {

    const code =
      await generateTOTP(
        account.secret
      );


    const codeElement =
      document.getElementById(
        `code-${account.id}`
      );

    if (codeElement) {
      codeElement.textContent = code;
    }


    updateTimer(account.id);

  } catch (error) {

    const codeElement =
      document.getElementById(
        `code-${account.id}`
      );

    if (codeElement) {
      codeElement.textContent = "ERROR";
    }

  }

}


/* =========================================================
   TIMER
   ========================================================= */

function updateTimer(id) {

  const seconds =
    30 - (
      Math.floor(Date.now() / 1000)
      % 30
    );


  const timer =
    document.getElementById(
      `timer-${id}`
    );

  const progress =
    document.getElementById(
      `progress-${id}`
    );


  if (timer) {

    timer.textContent =
      `${seconds}s remaining`;

  }


  if (progress) {

    progress.style.width =
      `${(seconds / 30) * 100}%`;

  }

}


/* =========================================================
   COPY CODE
   ===================================================
   ACCOUNTS
========================================================= */

async function addAccount(){

 const issuer =
 document.getElementById(
  "issuer"
 ).value.trim();

 const account =
 document.getElementById(
  "account"
 ).value.trim();

 const secret =
 document.getElementById(
  "secret"
 ).value
 .trim()
 .replace(/\s+/g,"")
 .toUpperCase();

 if(!secret){
  alert("Enter a TOTP secret.");
  return;
 }

 try{

  base32ToBytes(secret);

 }catch(error){

  alert(error.message);
  return;

 }

 accounts.push({
  issuer,
  account,
  secret
 });

 await saveVault();

 document.getElementById(
  "issuer"
 ).value="";

 document.getElementById(
  "account"
 ).value="";

 document.getElementById(
  "secret"
 ).value="";

 render();

}


async function deleteAccount(index){

 if(!confirm(
  "Delete this account?"
 )) return;

 accounts.splice(index,1);

 await saveVault();

 render();

}


/* =========================================================
   LOGOS
========================================================= */

function getLogo(issuer){

 const name =
 (issuer || "")
 .toLowerCase();

 if(name.includes("discord"))
  return "💬";

 if(name.includes("google"))
  return "🔵";

 if(name.includes("github"))
  return "🐙";

 if(name.includes("microsoft"))
  return "🪟";

 if(name.includes("apple"))
  return "";

 if(name.includes("amazon"))
  return "📦";

 if(name.includes("facebook") ||
    name.includes("meta"))
  return "Ⓜ️";

 return "🔐";

}


/* =========================================================
   RENDER
========================================================= */

async function render(){

 const root =
 document.getElementById(
  "accounts"
 );

 if(accounts.length === 0){

  root.innerHTML =
  `<div class="card">
   <p class="small">
    No accounts added yet.
   </p>
  </div>`;

  return;

 }

 root.innerHTML =
 accounts.map(
 (a,i)=>`

 <div class="card">

  <div class="account">

   <div class="logo">
    ${getLogo(a.issuer)}
   </div>

   <div>
    <div class="name">
     ${escapeHTML(
      a.account || "Account"
     )}
    </div>

    <div class="issuer">
     ${escapeHTML(
      a.issuer || "Authenticator"
     )}
    </div>
   </div>

  </div>

  <div
   class="code"
   id="code-${i}">
   ------
  </div>

  <div
   class="timer"
   id="timer-${i}">
   Loading...
  </div>

  <div class="progress">
   <span id="bar-${i}"></span>
  </div>

  <div class="buttons">

   <button
    class="secondary"
    onclick="copyCode(${i})">
    📋 Copy
   </button>

   <button
    class="danger"
    onclick="deleteAccount(${i})">
    Delete
   </button>

  </div>

 </div>

 `
 ).join("");

 await updateCodes();

}


async function updateCodes(){

 const seconds =
 Math.floor(
  Date.now()/1000
 );

 const remaining =
 30-(seconds%30);

 const percentage =
 remaining/30*100;

 for(
 let i=0;
 i<accounts.length;
 i++
 ){

  try{

   const code =
   await generateCode(
    accounts[i].secret
   );

   const codeElement =
   document.getElementById(
    `code-${i}`
   );

   if(codeElement)
    codeElement.textContent =
    code;

   const timer =
   document.getElementById(
    `timer-${i}`
   );

   if(timer)
    timer.textContent =
    `Changes in ${remaining}s`;

   const bar =
   document.getElementById(
    `bar-${i}`
   );

   if(bar)
    bar.style.width =
    percentage+"%";

  }catch{}

 }

}


async function copyCode(index){

 const code =
 await generateCode(
  accounts[index].secret
 );

 try{

  await navigator.clipboard.writeText(
   code
  );

  alert("Code copied.");

 }catch{

  alert(
   "Copy failed. Your browser may block clipboard access."
  );

 }

}


function escapeHTML(text){

 return String(text).replace(
  /[&<>"']/g,
  char=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[char])
 );

}


/* =========================================================
   ENCRYPTED BACKUP
========================================================= */

async function exportBackup(){

 if(!password){

  alert("Unlock the vault first.");
  return;

 }

 const backup =
 JSON.stringify(
  {
   type:"secure-authenticator-backup",
   version:1,
   vault
  },
  null,
  2
 );

 const blob =
 new Blob(
  [backup],
  {type:"application/json"}
 );

 const url =
 URL.createObjectURL(blob);

 const link =
 document.createElement("a");

 link.href=url;

 link.download=
 "authenticator-backup.auth";

 link.click();

 URL.revokeObjectURL(url);

}


async function importBackup(event){

 const file =
 event.target.files[0];

 if(!file) return;

 try{

  const text =
  await file.text();

  const imported =
  JSON.parse(text);

  if(
   imported.type !==
   "secure-authenticator-backup"
  ){

   throw new Error(
    "Invalid backup."
   );

  }

  if(
   !confirm(
    "Importing will replace the current vault. Continue?"
   )
  ) return;

  localStorage.setItem(
   VAULT_KEY,
   JSON.stringify(
    imported.vault
   )
  );

  alert(
   "Backup imported. Unlock it using the password that protected the backup."
  );

  location.reload();

 }catch(error){

  alert(
   "Could not import backup."
  );

 }

 event.target.value="";

}
