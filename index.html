/* =========================================================
   SIGN UP / LOGIN
   ========================================================= */

async function handleAuth() {

    hideStatus(authStatus);

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;

    if (!email) {

        showStatus(
            authStatus,
            "Please enter your email.",
            "error"
        );

        return;
    }

    if (!password) {

        showStatus(
            authStatus,
            "Please enter a password.",
            "error"
        );

        return;
    }

    if (authMode === "signup") {

        if (password.length < 6) {

            showStatus(
                authStatus,
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }

        if (password !== confirmPassword) {

            showStatus(
                authStatus,
                "Passwords do not match.",
                "error"
            );

            return;
        }
    }

    authButton.disabled = true;

    authButton.textContent =
        authMode === "signup"
        ? "Creating..."
        : "Logging in...";

    try {

        let result;

        if (authMode === "signup") {

            result =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

        } else {

            result =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
        }

        if (result.error) {

            throw result.error;
        }

        if (authMode === "signup") {

            if (result.data.session) {

                showStatus(
                    authStatus,
                    "Account created successfully!",
                    "success"
                );

            } else {

                showStatus(
                    authStatus,
                    "Account created. Check your email to confirm your account, then log in.",
                    "success"
                );
            }

        } else {

            showStatus(
                authStatus,
                "Login successful!",
                "success"
            );
        }

    } catch (error) {

        console.error(error);

        showStatus(
            authStatus,
            error.message || "Authentication failed.",
            "error"
        );

    } finally {

        authButton.disabled = false;

        authButton.textContent =
            authMode === "signup"
            ? "Create Account"
            : "Log In";
    }
}

/* =========================================================
   PASSWORD KEY DERIVATION
   ========================================================= */

async function deriveKey(password, salt) {

    const encoder =
        new TextEncoder();

    const passwordBytes =
        encoder.encode(password);

    const baseKey =
        await crypto.subtle.importKey(
            "raw",
            passwordBytes,
            "PBKDF2",
            false,
            ["deriveKey"]
        );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 310000,
            hash: "SHA-256"
        },
        baseKey,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt", "decrypt"]
    );
}


/* =========================================================
   ENCRYPT
   ========================================================= */

async function encryptVault(data, password) {

    const encoder =
        new TextEncoder();

    const salt =
        crypto.getRandomValues(
            new Uint8Array(16)
        );

    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );

    const key =
        await deriveKey(
            password,
            salt
        );

    const plaintext =
        encoder.encode(
            JSON.stringify(data)
        );

    const encrypted =
        await crypto.subtle.encrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            key,
            plaintext
        );

    return {

        version: 1,

        salt: bytesToBase64(salt),

        iv: bytesToBase64(iv),

        data: bytesToBase64(
            new Uint8Array(encrypted)
        )
    };
}


/* =========================================================
   DECRYPT
   ========================================================= */

async function decryptVault(encryptedVault, password) {

    const salt =
        base64ToBytes(
            encryptedVault.salt
        );

    const iv =
        base64ToBytes(
            encryptedVault.iv
        );

    const ciphertext =
        base64ToBytes(
            encryptedVault.data
        );

    const key =
        await deriveKey(
            password,
            salt
        );

    const decrypted =
        await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            key,
            ciphertext
        );

    const decoder =
        new TextDecoder();

    return JSON.parse(
        decoder.decode(decrypted)
    );
}


/* =========================================================
   BASE64 HELPERS
   ========================================================= */

function bytesToBase64(bytes) {

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {

        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}


function base64ToBytes(base64) {

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}

            console.error(error);

            showStatus(
                vaultStatus,
                "Could not load cloud vault: " +
                error.message,

            );

        if (data && data.encrypted_vault) {

            window.cloudEncryptedVault =
                typeof data.encrypted_vault === "string"
                ? JSON.parse(data.encrypted_vault)

            window.cloudEncryptedVault = null;
        }

    } catch (error) {

        console.error(error);

        showStatus(
            vaultStatus,
            error.message,
            "error"
        );
    }
}

    if (authMode === "signup") {

      const confirmPassword =
        document.getElementById(

      if (
        password !==

        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email:

      if (error) {
        throw error;

      if (!data.session) {

      error.message ||
      "Authentication failed.";

async function encryptVault(
  data,
  password,
  salt
) {

  const key =
    await deriveKey(
      password,
      salt
    );


  const iv =
    randomBytes(12);


  const encoded =
    new TextEncoder().encode(
      JSON.stringify(data)
    );


  const encrypted =
    await crypto.subtle.encrypt(

      {
        name: "AES-GCM",
        iv: iv
      },

      key,

      encoded

    );


  return {

    salt:
      bytesToBase64(salt),

    iv:
      bytesToBase64(iv),

    data:
      bytesToBase64(
        new Uint8Array(encrypted)
      )

  };
}


/* =========================================================
   DECRYPT
   ========================================================= */

async function decryptVault(
  encryptedVault,
  password
) {

  const salt =
    base64ToBytes(
      encryptedVault.salt
    );


  const iv =
    base64ToBytes(
      encryptedVault.iv
    );


  const encrypted =
    base64ToBytes(
      encryptedVault.data
    );


  const key =
    await deriveKey(
      password,
      salt
    );


  const decrypted =
    await crypto.subtle.decrypt(

      {
        name: "AES-GCM",
        iv: iv
      },

      key,

      encrypted

    );


  const text =
    new TextDecoder().decode(
      decrypted
    );


  return JSON.parse(text);
}

/* =========================================================

   ========================================================= */

async function handleAuth() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;


  const message =
    document.getElementById(
      "authMessage"
    );


  message.textContent =
    "Please wait...";


  if (!email) {

    message.textContent =
      "Enter your email.";

    return;
  }


  if (password.length < 8) {

    message.textContent =
      "Password must be at least 8 characters.";

    return;
  }


  try {

    if (authMode === "signup") {

      const confirm =
        document.getElementById(
          "confirmPassword"
        ).value;


      if (password !== confirm) {

        message.textContent =
          "Passwords do not match.";

        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password

        });


      if (error) {
        throw error;
      }


      /*
        If email confirmation is enabled,
        Supabase normally returns a user but
        no active session until the email is
        confirmed.
      */

      if (!data.session) {

        message.textContent =
          "Account created. Check your email to confirm your account, then log in.";

        return;
      }

    } else {

      const {
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {
        throw error;
      }

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      error.message ||
      "Authentication failed.";

  }

}

/* =========================================================
   IMAGE PREVIEW
   ========================================================= */

function previewImage(event) {

  const file = event.target.files[0];

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    alert("Please select an image.");

    event.target.value = "";

    return;
  }


  /*
    Limit image size before converting it.

    This keeps the encrypted vault from becoming
    unnecessarily large.
  */

  if (file.size > 2 * 1024 * 1024) {

    alert("Please choose an image smaller than 2 MB.");

    event.target.value = "";

    return;
  }


  const reader = new FileReader();

  reader.onload = function() {

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src = reader.result;

    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}

/* =========================================================
   FILE → DATA URL
   ========================================================= */

function fileToDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });
}

/* =========================================================
   BASE32 DECODER
   ========================================================= */

function base32ToBytes(base32) {

  const alphabet =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

  let bits = "";
  let output = [];

  base32 =
    base32
      .replace(/=+$/, "")
      .replace(/\s/g, "")
      .toUpperCase();


  for (const char of base32) {

    const value =
      alphabet.indexOf(char);

    if (value === -1) {
      throw new Error("Invalid Base32");
    }

    bits +=
      value
        .toString(2)
        .padStart(5, "0");
  }


  for (
    let i = 0;
    i + 8 <= bits.length;
    i += 8
  ) {

    output.push(
      parseInt(
        bits.slice(i, i + 8),
        2
      )
    );

  }


  return new Uint8Array(output);
}


/* =========================================================
   TOTP
   ========================================================= */

async function generateTOTP(secret) {

  const keyBytes =
    base32ToBytes(secret);


  const counter =
    Math.floor(
      Date.now() / 1000 / 30
    );


  const counterBytes =
    new ArrayBuffer(8);

  const view =
    new DataView(counterBytes);


  const high =
    Math.floor(
      counter / 0x100000000
    );

  const low =
    counter >>> 0;


  view.setUint32(0, high);
  view.setUint32(4, low);


  const key =
    await crypto.subtle.importKey(
      "raw",
      keyBytes,
      {
        name: "HMAC",
        hash: "SHA-1"
      },
      false,
      ["sign"]
    );


  const signature =
    new Uint8Array(
      await crypto.subtle.sign(
        "HMAC",
        key,
        counterBytes
      )
    );


  const offset =
    signature[
      signature.length - 1
    ] & 15;


  const binary =
    (
      ((signature[offset] & 127) << 24) |
      ((signature[offset + 1] & 255) << 16) |
      ((signature[offset + 2] & 255) << 8) |
      (signature[offset + 3] & 255)
    ) >>> 0;


  const code =
    binary % 1000000;


  return String(code)
    .padStart(6, "0");
}

async function copyCode(index){

 const code =
 await generateCode(
  accounts[index].secret
 );

 try{

  await navigator.clipboard.writeText(
   code
  );

  alert("Code copied.");

 }catch{

  alert(
   "Copy failed. Your browser may block clipboard access."
  );

 }

}


function escapeHTML(text){

 return String(text).replace(
  /[&<>"']/g,
  char=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[char])
 );

}


/* =========================================================
   ENCRYPTED BACKUP
========================================================= */

async function exportBackup(){

 if(!password){

  alert("Unlock the vault first.");
  return;

 }

 const backup =
 JSON.stringify(
  {
   type:"secure-authenticator-backup",
   version:1,
   vault
  },
  null,
  2
 );

 const blob =
 new Blob(
  [backup],
  {type:"application/json"}
 );

 const url =
 URL.createObjectURL(blob);

 const link =
 document.createElement("a");

 link.href=url;

 link.download=
 "authenticator-backup.auth";

 link.click();

 URL.revokeObjectURL(url);

}


async function importBackup(event){

 const file =
 event.target.files[0];

 if(!file) return;

 try{

  const text =
  await file.text();

  const imported =
  JSON.parse(text);

  if(
   imported.type !==
   "secure-authenticator-backup"
  ){

   throw new Error(
    "Invalid backup."
   );

  }

  if(
   !confirm(
    "Importing will replace the current vault. Continue?"
   )
  ) return;

  localStorage.setItem(
   VAULT_KEY,
   JSON.stringify(
    imported.vault
   )
  );

  alert(
   "Backup imported. Unlock it using the password that protected the backup."
  );

  location.reload();

 }catch(error){

  alert(
   "Could not import backup."
  );

 }

 event.target.value="";

}
